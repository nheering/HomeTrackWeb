version: '3.8'

services:
  # PostgreSQL Datenbank
  postgres:
    image: postgres:15-alpine
    container_name: hometrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hometrack_db}
      POSTGRES_USER: ${POSTGRES_USER:-hometrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hometrack_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    volumes:
      # Daten persistieren in einem benannten Volume
      - hometrack-postgres-data:/var/lib/postgresql/data
      # Initialisierungs-SQL ausfuehren
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      # Optionale Seed-Daten
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hometrack_user} -d ${POSTGRES_DB:-hometrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hometrack-network

  # PostGraphile - GraphQL API fuer PostgreSQL (Alternative zu Hasura)
  # Optional: Kann verwendet werden um die existierenden GraphQL-Queries zu behalten
  postgraphile:
    image: graphile/postgraphile:v4.13.0
    container_name: hometrack-postgraphile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hometrack_user}:${POSTGRES_PASSWORD:-hometrack_pass}@postgres:5432/${POSTGRES_DB:-hometrack_db}
      # PostGraphile Konfiguration
      PG_DEFAULT_ROLE: ${POSTGRES_USER:-hometrack_user}
      # JWT Secret fuer Auth (muß mit Frontend uebereinstimmen)
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-change-in-production}
      JWT_ALGORITHM: HS256
      # CORS Einstellungen fuer Next.js Dev Server
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "${POSTGRAPHILE_PORT:-5000}:5000"
    command:
      - --connection
      - postgres://${POSTGRES_USER:-hometrack_user}:${POSTGRES_PASSWORD:-hometrack_pass}@postgres:5432/${POSTGRES_DB:-hometrack_db}
      - --schema
      - public
      - --watch
      - --dynamic-json
      - --enable-cors
      - --allow-explain
      - --no-setof-functions-contain-nulls
      - --no-ignore-rbac
      - --show-error-stack
      - --extended-errors
      - hint
      - errors
      - details
    networks:
      - hometrack-network

  # pgAdmin - Web-UI fuer PostgreSQL Verwaltung (optional)
  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: hometrack-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hometrack.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - hometrack-pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - hometrack-network

networks:
  hometrack-network:
    driver: bridge

volumes:
  hometrack-postgres-data:
    driver: local
  hometrack-pgadmin-data:
    driver: local
