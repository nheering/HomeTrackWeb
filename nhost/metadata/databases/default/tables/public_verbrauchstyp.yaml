table:
  name: verbrauchstyp
  schema: public
array_relationships:
  - name: verbrauchsstellen
    using:
      foreign_key_constraint_on:
        column: verbrauchstyp_id
        table:
          name: verbrauchsstelle
          schema: public
  - name: verbrauchswerte
    using:
      foreign_key_constraint_on:
        column: verbrauchstyp_id
        table:
          name: verbrauchswert
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: x-hasura-user-id
      columns:
        - name
        - einheit
        - symbol
        - farbe
        - bild_url
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - name
        - einheit
        - symbol
        - farbe
        - bild_url
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - einheit
        - symbol
        - farbe
        - bild_url
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
