table:
  name: verbrauchsstelle
  schema: public
object_relationships:
  - name: verbrauchstyp
    using:
      foreign_key_constraint_on: verbrauchstyp_id
array_relationships:
  - name: verbrauchswerte
    using:
      foreign_key_constraint_on:
        column: verbrauchsstelle_id
        table:
          name: verbrauchswert
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: x-hasura-user-id
      columns:
        - verbrauchstyp_id
        - bezeichnung
        - zaehler_nummer
        - zaehler_typ
        - einbau_datum
        - standort
        - marke_hersteller
        - ist_aktiv
        - ist_standard
        - notizen
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - verbrauchstyp_id
        - bezeichnung
        - zaehler_nummer
        - zaehler_typ
        - einbau_datum
        - standort
        - marke_hersteller
        - ist_aktiv
        - ist_standard
        - notizen
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - verbrauchstyp_id
        - bezeichnung
        - zaehler_nummer
        - zaehler_typ
        - einbau_datum
        - standort
        - marke_hersteller
        - ist_aktiv
        - ist_standard
        - notizen
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
