table:
  name: verbrauchswert
  schema: public
object_relationships:
  - name: verbrauchstyp
    using:
      foreign_key_constraint_on: verbrauchstyp_id
  - name: verbrauchsstelle
    using:
      foreign_key_constraint_on: verbrauchsstelle_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: me
    permission:
      columns:
        - id
        - user_id
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
  - role: me
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      columns:
        - user_id
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
update_permissions:
  - role: user
    permission:
      columns:
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
  - role: me
    permission:
      columns:
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: me
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
