table:
  name: anbieter
  schema: public
object_relationships:
  - name: verbrauchstyp
    using:
      foreign_key_constraint_on: verbrauchstyp_id
array_relationships:
  - name: vertraege
    using:
      foreign_key_constraint_on:
        column: anbieter_id
        table:
          name: vertrag
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - verbrauchstyp_id
        - name
        - strasse
        - hausnummer
        - plz
        - ort
        - telefon
        - email
        - webseite
        - kundennummer
        - notizen
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - verbrauchstyp_id
        - name
        - strasse
        - hausnummer
        - plz
        - ort
        - telefon
        - email
        - webseite
        - kundennummer
        - notizen
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - verbrauchstyp_id
        - name
        - strasse
        - hausnummer
        - plz
        - ort
        - telefon
        - email
        - webseite
        - kundennummer
        - notizen
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
