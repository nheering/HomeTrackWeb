table:
  name: verbrauchswert
  schema: public
object_relationships:
  - name: verbrauchsstelle
    using:
      foreign_key_constraint_on: verbrauchsstelle_id
  - name: verbrauchstyp
    using:
      foreign_key_constraint_on: verbrauchstyp_id
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: x-hasura-user-id
      columns:
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - verbrauchstyp_id
        - verbrauchsstelle_id
        - datum
        - zaehlerstand
        - verbrauch
        - bild_url
        - notizen
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
