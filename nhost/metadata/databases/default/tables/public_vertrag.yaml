table:
  name: vertrag
  schema: public
object_relationships:
  - name: anbieter
    using:
      foreign_key_constraint_on: anbieter_id
  - name: verbrauchstyp
    using:
      foreign_key_constraint_on: verbrauchstyp_id
array_relationships:
  - name: preisperioden
    using:
      foreign_key_constraint_on:
        column: vertrag_id
        table:
          name: preisperiode
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - anbieter_id
        - verbrauchstyp_id
        - bezeichnung
        - vertragsnummer
        - beginn_datum
        - ende_datum
        - kuendigungsfrist
        - zahlungsintervall
        - notizen
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - anbieter_id
        - verbrauchstyp_id
        - bezeichnung
        - vertragsnummer
        - beginn_datum
        - ende_datum
        - kuendigungsfrist
        - zahlungsintervall
        - notizen
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - anbieter_id
        - verbrauchstyp_id
        - bezeichnung
        - vertragsnummer
        - beginn_datum
        - ende_datum
        - kuendigungsfrist
        - zahlungsintervall
        - notizen
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
