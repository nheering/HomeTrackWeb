table:
  name: preisperiode
  schema: public
object_relationships:
  - name: vertrag
    using:
      foreign_key_constraint_on: vertrag_id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - gueltig_ab
        - gueltig_bis
        - einheitspreis
        - grundpreis
        - steuer
        - grundpreis_intervall
        - notizen
        - aktualisiert_am
        - erstellt_am
        - id
        - user_id
        - vertrag_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - vertrag_id
        - gueltig_ab
        - gueltig_bis
        - grundpreis
        - grundpreis_intervall
        - einheitspreis
        - steuer
        - notizen
        - erstellt_am
        - aktualisiert_am
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - vertrag_id
        - gueltig_ab
        - gueltig_bis
        - grundpreis
        - grundpreis_intervall
        - einheitspreis
        - steuer
        - notizen
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
